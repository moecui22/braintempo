<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="braintempo">
  <title>braintempo</title>
  <rect width="512" height="512" rx="114" ry="114" fill="#0066cc"/>
  <!-- brain: an ellipse plus lobes, unioned by shared fill -->
  <g fill="#ffffff">
    <ellipse cx="256" cy="196" rx="114" ry="80"/>
    <circle cx="176" cy="152" r="46"/>
    <circle cx="238" cy="136" r="48"/>
    <circle cx="306" cy="142" r="46"/>
    <circle cx="352" cy="184" r="44"/>
    <circle cx="160" cy="196" r="44"/>
    <circle cx="196" cy="242" r="44"/>
    <circle cx="316" cy="242" r="44"/>
  </g>
  <!-- one fold down the midline -->
  <path fill="none" stroke="#0066cc" stroke-width="17" stroke-linecap="round"
        d="M256 100 C242 140, 268 168, 250 204 C236 236, 264 254, 256 284"/>
  <!-- keyboard -->
  <g fill="#ffffff">
    <rect x="128" y="336" width="72" height="58" rx="17"/>
    <rect x="220" y="336" width="72" height="58" rx="17"/>
    <rect x="312" y="336" width="72" height="58" rx="17"/>
    <rect x="128" y="408" width="256" height="34" rx="17" opacity=".6"/>
  </g>
</svg>
